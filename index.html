
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex items-center justify-center">

    <div class="calculator">

        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl font-bold text-white">
                    Mbh Calculator
                </h1>
                <p class="text-gray-400 text-xs mt-1">
                    Advanced Mathematics
                </p>
            </div>

            <button id="angleMode"
                class="mode-btn"
                onclick="toggleAngleMode()">
                DEG
            </button>
        </div>

        <!-- Display -->
        <div class="display mb-5">
            <div id="history" class="history"></div>
            <input
                type="text"
                id="display"
                value="0"
                readonly
                aria-label="Calculator display"
            >
        </div>

        <!-- Calculator Buttons -->
        <div class="grid grid-cols-5 gap-2">

            <!-- Row 1 -->
            <button class="btn function" onclick="clearDisplay()">AC</button>
            <button class="btn function" onclick="deleteLast()">DEL</button>
            <button class="btn function" onclick="appendValue('(')">(</button>
            <button class="btn function" onclick="appendValue(')')">)</button>
            <button class="btn operator" onclick="appendValue('/')">÷</button>

            <!-- Row 2 -->
            <button class="btn function" onclick="scientific('sin')">sin</button>
            <button class="btn function" onclick="scientific('cos')">cos</button>
            <button class="btn function" onclick="scientific('tan')">tan</button>
            <button class="btn function" onclick="scientific('sqrt')">√</button>
            <button class="btn operator" onclick="appendValue('*')">×</button>

            <!-- Row 3 -->
            <button class="btn function" onclick="scientific('log')">log</button>
            <button class="btn function" onclick="scientific('ln')">ln</button>
            <button class="btn function" onclick="appendValue('^')">xʸ</button>
            <button class="btn function" onclick="appendValue('^2')">x²</button>
            <button class="btn operator" onclick="appendValue('-')">−</button>

            <!-- Row 4 -->
            <button class="btn number" onclick="appendValue('7')">7</button>
            <button class="btn number" onclick="appendValue('8')">8</button>
            <button class="btn number" onclick="appendValue('9')">9</button>
            <button class="btn function" onclick="scientific('factorial')">n!</button>
            <button class="btn operator" onclick="appendValue('+')">+</button>

            <!-- Row 5 -->
            <button class="btn number" onclick="appendValue('4')">4</button>
            <button class="btn number" onclick="appendValue('5')">5</button>
            <button class="btn number" onclick="appendValue('6')">6</button>
            <button class="btn function" onclick="appendValue('pi')">π</button>
            <button class="btn function" onclick="appendValue('e')">e</button>

            <!-- Row 6 -->
            <button class="btn number" onclick="appendValue('1')">1</button>
            <button class="btn number" onclick="appendValue('2')">2</button>
            <button class="btn number" onclick="appendValue('3')">3</button>
            <button class="btn function" onclick="scientific('inverse')">1/x</button>
            <button class="btn function" onclick="scientific('percent')">%</button>

            <!-- Row 7 -->
            <button class="btn number" onclick="appendValue('0')">0</button>
            <button class="btn number" onclick="appendValue('.')">.</button>
            <button class="btn function" onclick="scientific('abs')">|x|</button>
            <button class="btn function" onclick="appendValue('^(-1)')">x⁻¹</button>
            <button class="btn equal" onclick="calculate()">=</button>

        </div>

        <!-- Footer -->
        <div class="text-center mt-5 text-gray-500 text-xs">
            Built with HTML, CSS & JavaScript ES6
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
